---
- name: Mount Agent ISO and boot from Virtual CD drive block
  block:
    - name: Delete all jobs on idrac
      dellemc.openmanage.idrac_lifecycle_controller_jobs:
        idrac_ip: "{{ lookup('community.general.dig', 'idrac-' ~ inventory_hostname) }}"
        idrac_user: "{{ idrac_admin_user }}"
        idrac_password: "{{ idrac_admin_password }}"
        validate_certs: False
      ignore_errors: True

    - name: Eject Virtual CD drive
      include_tasks: eject-virtual-cd.yaml

    - name: pause for 10 seconds
      pause:
        seconds: 10

    - name: Create idrac session
      dellemc.openmanage.idrac_session:
        hostname: "{{ lookup('community.general.dig', 'idrac-' ~ inventory_hostname) }}"
        username: "{{ idrac_admin_user }}"
        password: "{{ idrac_admin_password }}"
        validate_certs: False
        state: present
      register: idrac_login_info


    - name: Mount Agent ISO (with recovery from stuck iDRAC8 virtual media service)
      block:
        - name: Mount Agent ISO
          dellemc.openmanage.idrac_virtual_media:
            idrac_ip: "{{ lookup('community.general.dig', 'idrac-' ~ inventory_hostname) }}"
            idrac_user: "{{ idrac_admin_user }}"
            idrac_password: "{{ idrac_admin_password }}"
            validate_certs: False
            force: True
            virtual_media:
              - insert: true
                image: "{{ web_server.http_base_url }}/{{ agent_iso_file_name }}"
                media_type: "CD"
                index: 1
          register: mount_iso_operation
          until: mount_iso_operation is not failed
          retries: 2
          delay: 30
      rescue:
        # Base.1.2.InternalError on the VirtualMedia.InsertMedia Redfish action is a known
        # iDRAC8 issue where the virtual media service gets stuck in a bad internal state.
        # Clearing LC jobs alone (done above) is not always enough; a graceful iDRAC restart
        # reliably clears it (see https://bugzilla.redhat.com/show_bug.cgi?id=1988879).
        - name: Delete Session before resetting iDRAC
          dellemc.openmanage.idrac_session:
            hostname: "{{ lookup('community.general.dig', 'idrac-' ~ inventory_hostname) }}"
            x_auth_token: "{{ idrac_login_info.x_auth_token }}"
            session_id: "{{ idrac_login_info.session_data.Id }}"
            validate_certs: False
            state: absent
          when: idrac_login_info.x_auth_token is defined
          ignore_errors: True

        - name: Gracefully restart iDRAC to clear stuck virtual media service
          dellemc.openmanage.idrac_reset:
            idrac_ip: "{{ lookup('community.general.dig', 'idrac-' ~ inventory_hostname) }}"
            idrac_user: "{{ idrac_admin_user }}"
            idrac_password: "{{ idrac_admin_password }}"
            validate_certs: False
            wait_for_idrac: True
            job_wait_timeout: 600

        - name: pause for 30 seconds after iDRAC reset
          pause:
            seconds: 30

        - name: Re-create idrac session after reset
          dellemc.openmanage.idrac_session:
            hostname: "{{ lookup('community.general.dig', 'idrac-' ~ inventory_hostname) }}"
            username: "{{ idrac_admin_user }}"
            password: "{{ idrac_admin_password }}"
            validate_certs: False
            state: present
          register: idrac_login_info

        - name: Retry Mount Agent ISO after iDRAC reset
          dellemc.openmanage.idrac_virtual_media:
            idrac_ip: "{{ lookup('community.general.dig', 'idrac-' ~ inventory_hostname) }}"
            idrac_user: "{{ idrac_admin_user }}"
            idrac_password: "{{ idrac_admin_password }}"
            validate_certs: False
            force: True
            virtual_media:
              - insert: true
                image: "{{ web_server.http_base_url }}/{{ agent_iso_file_name }}"
                media_type: "CD"
                index: 1
          register: mount_iso_operation
          until: mount_iso_operation is not failed
          retries: 1
          delay: 30

    - name: pause for 10 seconds
      pause:
        seconds: 10

    - name: Configure the boot source override to boot from CD
      dellemc.openmanage.idrac_boot:
        idrac_ip: "{{ lookup('community.general.dig', 'idrac-' ~ inventory_hostname) }}"
        x_auth_token: "{{ idrac_login_info.x_auth_token }}"
        validate_certs: False
        boot_source_override_mode: uefi
        boot_source_override_target: uefi_target
        uefi_target_boot_source_override: "{{ virtual_media_uefi_path }}"
        boot_source_override_enabled: once
        reset_type: "force_restart"
        job_wait_timeout: 600
        job_wait: True
      ignore_errors: True
      register: one_time_boot_operation
      until: '"Successfully" in one_time_boot_operation.msg '
      retries: 1
      delay: 30

    - name: One time boot from CD operation result
      debug:
        var: one_time_boot_operation

    - name: Performing power on operation if device is off
      dellemc.openmanage.redfish_powerstate:
        baseuri: "{{ lookup('community.general.dig', 'idrac-' ~ inventory_hostname) }}"
        username: "{{ idrac_admin_user }}"
        password: "{{ idrac_admin_password }}"
        validate_certs: false
        reset_type: "On"
      register: power_on_command
      when: '"off" in one_time_boot_operation.msg'

    - debug:
        msg: "{{ power_on_command.msg }}"
      when: '"off" in one_time_boot_operation.msg'

  always:
    - name: Delete Session
      dellemc.openmanage.idrac_session:
        hostname: "{{ lookup('community.general.dig', 'idrac-' ~ inventory_hostname) }}"
        x_auth_token: "{{ idrac_login_info.x_auth_token }}"
        session_id: "{{ idrac_login_info.session_data.Id }}"
        validate_certs: False
        state: absent
      when: idrac_login_info.x_auth_token is defined

