---
# This is jus for debugging purposes
- name: Process all templates
  template:
    src: "{{ item }}"
    dest: "{{ staging_dir }}"
  with_fileglob:
    - ../templates/*

- name: Create Namespace
  k8s:
    state: present
    definition: "{{ lookup('template', 'namespace.yaml') }}"

- name: Apply Network Attachment Definition
  k8s:
    state: present
    definition: "{{ lookup('template', 'bridge-nad.yaml') }}"

- name: Add user ca configmap to cluster namespace
  k8s:
    state: present
    definition: "{{ lookup('template', 'user-ca-configmap.yaml') }}"

# Only create secrets for UPI install type
- name: Create secrets from Ignition files for UPI install type
  shell:
    cmd: "{{ oc_bin }} create secret generic {{ item }}-ign --from-file=userdata={{ ocp_install_dir }}/{{ item }}.ign -n {{ ocp_cluster_namespace }} --dry-run=client -o yaml | {{ oc_bin }} apply -f -"
  loop:
    - master
    - worker
  when: install_type is defined and install_type == "upi"

- name: Create bootstrap secrets from Ignition file for UPI install type
  shell:
    cmd: "{{ oc_bin }} create secret generic bootstrap-ign --from-file=userdata={{ bootstrap_ign }} -n {{ ocp_cluster_namespace }} --dry-run=client -o yaml | {{ oc_bin }} apply -f -"
  when: install_type is defined and install_type == "upi"
