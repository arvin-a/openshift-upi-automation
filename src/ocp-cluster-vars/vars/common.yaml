---
# Client / static configuration (no Bitwarden, no Ansible Vault for secrets).
# Load configs: secrets are read from this file when config_secrets_source is static.
#
# Cluster main.yaml should list only:
#   - "{{ config_dir }}/../common.yaml"
#   - "{{ config_dir }}/vars.yaml"
# Remove credentials.yaml and drop --vault-password-file from ansible-playbook.
#
# Test Load configs only:
#   cd src/ansible && ansible-playbook playbooks/openshift-kvm-bm-cluster-deploy.yaml \
#     -i ../ocp-cluster-vars/vars/<cluster>/inventory.yaml -e cluster_name=<cluster> \
#     --tags always --skip-tags pre-install-deco,staging-dir-setup,openshift-download-artifacts

config_secrets_source: static

###############################################################################
# Staging paths (install working directory on the Ansible controller)
###############################################################################
staging_base_dir: "/var/tmp/ansible-{{ lookup('env', 'USER') }}"
staging_temp_dir: "{{ staging_base_dir }}/tmp"
binary_archive_base_dir: "{{ staging_base_dir }}/bin"
ocp_binaries_archive_base_dir: "{{ binary_archive_base_dir }}/ocp"

staging_dir: "{{ staging_base_dir }}/{{ ocp_cluster_name }}"
staging_backup_dir: "{{ staging_base_dir }}/{{ ocp_cluster_name }}/backup"
ocp_install_dir: "{{ staging_dir }}/ocp-install"
cluster_kubeconfig: "{{ staging_dir }}/{{ ocp_cluster_name }}-kubeconfig"
rhcos_ssh_private_key_file: "{{ staging_dir }}/rhcos-ssh-pk"

###############################################################################
# OpenShift client / installer / butane (pre-installed on controller; no download)
###############################################################################
ocp_skip_download_artifacts: true
oc_bin: "/usr/local/bin/oc"
openshift_install_bin: "/usr/local/bin/openshift-install"
butane_bin: "/usr/local/bin/butane"

# Leave in place for roles that still reference URLs; unused when ocp_skip_download_artifacts is true.
ocp_bin_base_url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp"
ocp_bin_release_url: "{{ ocp_bin_base_url }}/{{ ocp_bin_channel }}-{{ ocp_version }}"
ocp_bin_client_archive_name: "openshift-client-linux.tar.gz"
ocp_bin_installer_archive_name: "openshift-install-linux.tar.gz"
ocp_bin_client_url: "{{ ocp_bin_release_url }}/{{ ocp_bin_client_archive_name }}"
ocp_bin_installer_url: "{{ ocp_bin_release_url }}/{{ ocp_bin_installer_archive_name }}"
jq_bin: "/usr/bin/jq"

###############################################################################
# Agent installer ISO
###############################################################################
agent_iso_file_name: "agent.x86_64.iso"
agent_iso_file_path: "{{ staging_dir }}/{{ agent_iso_file_name }}"
kubeconfig_src_path: "{{ ocp_install_dir }}/auth/kubeconfig"
kubeadmin_password_src_path: "{{ ocp_install_dir }}/auth/kubeadmin-password"
bootstrap_ign: "{{ ocp_install_dir }}/bootstrap-pointer.ign"

###############################################################################
# HTTP server that hosts the Agent ISO (BM iDRAC virtual media URL)
# Set web_server_host to the same FQDN or IP as in inventory group webserver.
###############################################################################
web_server_host: "CHANGEME-webserver.example.com"
web_server:
  files_root_path: "/var/www/html/{{ ocp_cluster_fqdn }}"
  http_base_url: "http://{{ web_server_host }}/{{ ocp_cluster_fqdn }}"
  python_interpreter: "/usr/bin/python3"

web_server_files_bin_path: "{{ web_server.files_root_path }}/bin/{{ ocp_version }}"
web_server_files_cluster_path: "{{ web_server.files_root_path }}/{{ ocp_cluster_name }}"
web_server_http_rhcos_url: "{{ web_server.http_base_url }}/bin/{{ ocp_version }}/{{ kubevirt_rhcos_bin_file_name | default('rhcos-live.x86_64.iso') }}"
agent_iso_http_url:

###############################################################################
# Cluster secrets (were Bitwarden / vault; set every CHANGEME)
###############################################################################
idrac_admin_user: "CHANGEME"
idrac_admin_password: "CHANGEME"

rhcos_ssh_pub_key: "ssh-ed25519 CHANGEME comment"

rhcos_ssh_private_key: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  CHANGEME
  -----END OPENSSH PRIVATE KEY-----

# PEM text for extra CAs (indent under install-config additionalTrustBundle). Use "" if none.
additional_trust_bundle: ""

# Red Hat pull secret: JSON string exactly as from console.redhat.com (not base64).
pull_secret: '{"auths":{"cloud.openshift.com":{"auth":"CHANGEME","email":"you@example.com"},"quay.io":{"auth":"CHANGEME","email":"you@example.com"},"registry.connect.redhat.com":{"auth":"CHANGEME","email":"you@example.com"},"registry.redhat.io":{"auth":"CHANGEME","email":"you@example.com"}}}'

# Post-install DNS-01 (cert-manager). Use placeholder if skipping post-install cert tags.
cloudflare_api_token: "CHANGEME"
cloudflare_zone_name: "example.com"
letsencrypt_email: "admin@example.com"

# Infra cluster / MetalLB BGP (cluster-config play). Dummy values OK if BGP post-install is skipped.
network_bgp_peer_asn: "65000"
network_bgp_peer_password: "CHANGEME"
network_bgp_peer_ip_address: "CHANGEME"

###############################################################################
# cert-manager operator namespaces
###############################################################################
cert_manager_operator_namespace: cert-manager-operator
cert_manager_operand_namespace: cert-manager
cert_manager_webhook_rollout_timeout: 10m

###############################################################################
# Optional disconnected registry mirrors (uncomment and set client mirror host)
###############################################################################
# image_content_sources:
#   - source: quay.io
#     mirrors:
#       - registry.example.com/mirror/quay.io
#   - source: registry.redhat.io
#     mirrors:
#       - registry.example.com/mirror/registry.redhat.io

# Legacy keys (unused when config_secrets_source is static; kept for reference)
bitwarden_secrets_cli: "/usr/bin/bws"
bitwarden_homelab_project_name: homelab
bitwarden_k8s_clusters_project_name: k8s_clusters
cluster_common_vault_secret_path: ahl-common
idrac_admin_password_vault_key: idrac_admin_password
idrac_admin_user_vault_key: idrac_admin_user
rhcos_ssh_pub_key_vault_key: rhcos_ssh_pub_key
rhcos_ssh_private_key_vault_key: rhcos_ssh_private_key
additional_trust_bundle_vault_key: additional_trust_bundle
pull_secret_vault_key: pull_secret
network_bgp_peer_asn_vault_key: network_bgp_peer_asn
network_bgp_peer_password_vault_key: network_bgp_peer_password
network_bgp_peer_ip_address_vault_key: network_bgp_peer_ip_address
cloudflare_api_token_vault_key: cloudflare_api_token

# Skip writing kubeconfig back to Bitwarden after install
openshift_credentials_store_enabled: false
